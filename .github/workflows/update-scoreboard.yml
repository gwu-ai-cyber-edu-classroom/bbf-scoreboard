name: Update Scoreboard

on:
  schedule:
    - cron: '*/5 * * * *'      # every 5 minutes
  workflow_dispatch:             # facilitator-triggered refresh
  push:
    paths:
      - teams.yaml
      - settings.yaml
      - scripts/update_scoreboard.py

permissions:
  contents: write                # to commit SCOREBOARD.md
  issues: read                   # read-only on this repo's own issues (cross-repo via PAT)

env:
  # Opt the bundled JS actions into Node 24 now, silencing the Node 20
  # deprecation warning on each run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Serialize runs so a cron tick and a dispatch/push can't race on `git push`.
concurrency:
  group: scoreboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyyaml

      - name: Rebuild scoreboard
        env:
          # SCOREBOARD_PAT must have Contents:read-write and Issues:read on
          # all repos in the org. See scoreboard/README.md.
          GH_TOKEN: ${{ secrets.SCOREBOARD_PAT }}
        run: python scripts/update_scoreboard.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain SCOREBOARD.md scores.json settings.json)" ]]; then
            git config user.name "bbf-scoreboard-bot"
            git config user.email "bbf-scoreboard-bot@users.noreply.github.com"
            git add SCOREBOARD.md scores.json settings.json
            git commit -m "scoreboard: auto-update $(date -u +%FT%TZ)"
            # Rebase-and-retry so a concurrent writer can't reject the push.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              if git push; then echo "pushed"; break; fi
              echo "push rejected, retrying ($attempt)…"; sleep $(( (RANDOM % 4) + 2 ))
            done
          else
            echo "No changes to commit."
          fi
