# BBF scoreboard settings — edit and commit.
#
# A push to this file triggers:
#   - apply-settings.yml: sets the updater cron from schedule.update_minutes and
#     enables/disables the updater workflow from schedule.enabled.
#   - update-scoreboard.yml: regenerates SCOREBOARD.md / scores.json / breaks.json
#     / settings.json. index.html reads settings.json + breaks.json on load.

# Page heading / browser title.
title: "BBF Scoreboard"

# Auto-update schedule (server side).
schedule:
  enabled: true            # turn the auto-update workflow on/off (no edits needed)
  update_minutes: 5        # how often the scoreboard recomputes (cron cadence)

display:
  live_updates: true       # browser re-fetches the board on an interval
  refresh_seconds: 30      # browser re-fetch cadence (when live_updates is on)
  theme: dark              # dark | light
  # The Graph, Break feed, Columns, and Teams sections are always present as
  # collapsible panels (collapsed by default — click ▸ to expand). They are not
  # hidden via settings.

# Overall Score weights (points). Tune freely.
scoring:
  landed: 10               # per confirmed break you filed against another team (first finder)
  high_sev_landed: 5       # extra, per high-severity break landed
  fixed: 5                 # per break against you closed by a merged PR
  received: -5             # per confirmed break others landed on you
  duplicate_halflife_minutes: 5   # later duplicates of the same break decay:
                                   # points = base * 0.5 ** (minutes_after_first / halflife)

history:
  max_points: 1000         # cap on scores.json datapoints (chart length)
