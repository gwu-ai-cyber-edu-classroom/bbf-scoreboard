<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BBF Scoreboard</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:#0a0e14; --panel:#0f1620; --panel-2:#131c28; --border:#1f2b3a;
      --text:#cdd9e5; --muted:#7a8aa0; --head:#e6edf3;
      --accent:#3fb950; --accent-2:#2f81f7; --danger:#f85149; --gold:#e3b341; --warn:#d29922;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    html[data-theme="light"] {
      --bg:#f6f8fa; --panel:#fff; --panel-2:#f0f3f6; --border:#d0d7de;
      --text:#1f2328; --muted:#636c76; --head:#0d1117;
      --accent:#1a7f37; --accent-2:#0969da; --danger:#cf222e; --gold:#9a6700; --warn:#9a6700;
    }
    * { box-sizing: border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--sans);
      max-width:1000px; margin:0 auto; padding:1.5em 1.25em 3em; line-height:1.5; }
    .topbar { display:flex; align-items:center; gap:.75em; flex-wrap:wrap;
      border-bottom:1px solid var(--border); padding-bottom:.8em; margin-bottom:1.2em; }
    .brand { font-family:var(--mono); font-weight:700; font-size:1.35rem; color:var(--head); }
    .brand .tick { color:var(--accent); }
    .live { display:inline-flex; align-items:center; gap:.45em; font-family:var(--mono);
      font-size:.72rem; color:var(--accent); border:1px solid var(--accent); border-radius:999px;
      padding:.15em .6em; text-transform:uppercase; letter-spacing:.08em; }
    .live .dot { width:.55em; height:.55em; border-radius:50%; background:var(--accent);
      animation:pulse 1.8s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,185,80,.6);} 70%{box-shadow:0 0 0 .5em rgba(63,185,80,0);} 100%{box-shadow:0 0 0 0 rgba(63,185,80,0);} }
    .spacer { flex:1; }
    .updated { font-family:var(--mono); font-size:.75rem; color:var(--muted); }

    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px;
      padding:1em 1.25em; margin:1em 0; }
    details.card > summary {
      list-style:none; cursor:pointer; font-family:var(--mono); font-size:.85rem;
      text-transform:uppercase; letter-spacing:.12em; color:var(--accent); user-select:none;
    }
    details.card > summary::-webkit-details-marker { display:none; }
    details.card > summary::before { content:"▸ "; color:var(--muted); }
    details.card[open] > summary::before { content:"▾ "; }
    details.card > summary .hint { float:right; color:var(--muted); text-transform:none; letter-spacing:0; font-size:.72rem; }
    details.card > *:not(summary) { margin-top:1em; }

    h1 { display:none; }
    h3 { font-family:var(--mono); color:var(--head); font-size:.95rem; margin:.8em 0 .4em; }
    p { color:var(--text); } em { color:var(--muted); font-style:normal; }
    a { color:var(--accent-2); text-decoration:none; } a:hover { text-decoration:underline; }
    code { font-family:var(--mono); font-size:.85em; background:var(--panel-2);
      border:1px solid var(--border); border-radius:5px; padding:.08em .4em; color:var(--head); }
    ul { padding-left:1.2em; } li { margin:.25em 0; }

    table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
    th, td { padding:.5em .7em; text-align:left; border-bottom:1px solid var(--border); vertical-align:top; }
    th { font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em;
      color:var(--muted); border-bottom:2px solid var(--border); }
    td { font-family:var(--mono); color:var(--head); }
    #board td:nth-child(2) { font-family:var(--sans); }
    #board tbody tr:hover, #feed-table tbody tr:hover { background:var(--panel-2); }
    #board tbody tr:first-child td { color:var(--gold); }
    #board td strong { color:var(--accent); }
    #board th:nth-child(n+3), #board td:nth-child(n+3) { text-align:right; }
    #board th:nth-child(2), #board td:nth-child(2) { text-align:left; }

    .controls { display:flex; gap:.8em; flex-wrap:wrap; align-items:center;
      font-family:var(--mono); font-size:.78rem; color:var(--muted); }
    .controls label { display:inline-flex; gap:.35em; align-items:center; }
    .controls select { background:var(--panel-2); color:var(--text); border:1px solid var(--border);
      border-radius:6px; padding:.25em .5em; font-family:var(--mono); font-size:.8rem; }
    .badge { display:inline-block; font-family:var(--mono); font-size:.7rem; text-transform:uppercase;
      letter-spacing:.05em; border-radius:5px; padding:.1em .5em; border:1px solid; }
    .st-pending { color:var(--warn); border-color:var(--warn); }
    .st-repro { color:var(--accent); border-color:var(--accent); }
    .st-fix-review { color:var(--gold); border-color:var(--gold); }
    .st-fixed { color:var(--accent-2); border-color:var(--accent-2); }
    .disc-black-box { color:var(--accent-2); border-color:var(--accent-2); }
    .disc-white-box { color:var(--gold); border-color:var(--gold); }
    .sev-high { color:var(--danger); font-weight:700; }
    .chart-wrap { position:relative; height:340px; }
    .score-help { margin-top:1em; padding-top:.8em; border-top:1px solid var(--border);
      color:var(--muted); font-size:.82rem; }
    .score-help strong { color:var(--head); }
    footer { color:var(--muted); font-family:var(--mono); font-size:.72rem; text-align:center; margin-top:2em; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand"><span class="tick">&gt;_</span> <span id="brand-title">BBF Scoreboard</span></span>
    <span id="live" class="live"><span class="dot"></span> live</span>
    <span class="spacer"></span>
    <span class="updated" id="updated"></span>
  </div>

  <!-- 1. Scores (always visible) -->
  <div id="board" class="card">Loading…</div>

  <!-- 2. Graph (open by default) -->
  <details id="sec-graph" class="card" open>
    <summary>Score over time <span class="hint">click to collapse</span></summary>
    <div class="chart-wrap"><canvas id="scoreChart"></canvas></div>
    <div id="score-help" class="score-help"></div>
  </details>

  <!-- 3. Break feed (open by default) -->
  <details id="sec-feed" class="card" open>
    <summary>Break feed <span class="hint">click to collapse</span></summary>
    <div class="controls">
      <label>Status
        <select id="f-status"><option value="all">all</option><option value="pending">pending</option><option value="repro">repro</option><option value="fix-review">fix-review</option><option value="fixed">fixed</option></select>
      </label>
      <label>Team <select id="f-team"><option value="all">all</option></select></label>
      <label>Severity
        <select id="f-sev"><option value="all">all</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
      </label>
      <label>Found
        <select id="f-disc"><option value="all">all</option><option value="black-box">black-box</option><option value="white-box">white-box</option></select>
      </label>
      <label>Sort
        <select id="f-sort"><option value="newest">newest</option><option value="status">status</option><option value="severity">severity</option><option value="team">team</option></select>
      </label>
    </div>
    <div id="feed-table"></div>
  </details>

  <!-- 4. What columns mean / acting on a break (collapsed by default) -->
  <details id="sec-columns" class="card">
    <summary>Columns &amp; acting on a break <span class="hint">click to show</span></summary>
    <div id="columns-body"></div>
  </details>

  <!-- 5. Teams roster (collapsed by default) -->
  <details id="sec-teams" class="card">
    <summary>Teams <span class="hint">click to show</span></summary>
    <div id="teams-body"></div>
  </details>

  <footer id="foot"></footer>

  <script>
    var DEFAULTS = { title:"BBF Scoreboard", liveUpdates:true, refreshSeconds:30, dataUpdateMinutes:5,
      theme:"dark", scoring:{landed:10,highSevLanded:5,fixed:5,received:-5} };
    var settings = DEFAULTS, chart = null, timer = null, allBreaks = [];
    var $ = function (id) { return document.getElementById(id); };
    function teamColor(i) { return "hsl(" + ((i * 67) % 360) + " 70% 55%)"; }
    function bust(u) { return u + "?_=" + Date.now(); }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

    function applyChrome() {
      document.documentElement.setAttribute("data-theme", settings.theme === "light" ? "light" : "dark");
      document.title = settings.title;
      $("brand-title").textContent = settings.title;
      $("live").style.display = settings.liveUpdates ? "" : "none";
      // Graph / Feed / Columns / Teams are always present as collapsible panels
      // (collapsed by default — click the ▸ to expand). They are not hidden via settings.
      var dm = settings.dataUpdateMinutes || 5;
      $("foot").textContent = "Scoreboard updates about every " + dm + " min (and immediately on each break/fix).";
      var css = getComputedStyle(document.documentElement);
      Chart.defaults.color = css.getPropertyValue("--muted").trim();
      Chart.defaults.borderColor = css.getPropertyValue("--border").trim();
      var w = settings.scoring || DEFAULTS.scoring, hl = w.duplicateHalflifeMinutes || 5;
      $("score-help").innerHTML =
        "<strong>How Score is calculated.</strong> Each team's Score sums its confirmed breaks: " +
        "<strong>+" + w.landed + "</strong> per break landed (against another team), <strong>+" + w.highSevLanded +
        "</strong> more if high severity, <strong>+" + w.fixed + "</strong> per fix the breaker confirmed, " +
        "<strong>" + w.received + "</strong> per break received. " +
        "<strong>First finder wins:</strong> for the same break (same target + property + attack class) the earliest filer earns full points; " +
        "later duplicates decay by half every " + hl + " min toward zero. Only confirmed (<code>valid</code>) breaks score; " +
        "the feed's <strong>Pts</strong> column shows each break's award.";
    }

    function renderColumns() {
      var w = settings.scoring || DEFAULTS.scoring;
      $("columns-body").innerHTML =
        "<h3>What the columns mean</h3><ul>" +
        "<li><strong>Score</strong> — overall points: +" + w.landed + " per break landed, +" + w.highSevLanded +
          " extra per high-severity break landed, +" + w.fixed + " per fix, " + w.received + " per break received. " +
          "<strong>First finder wins:</strong> the first team to file a given break (same target + property + class) earns full points; " +
          "later duplicates decay by half every " + (w.duplicateHalflifeMinutes || 5) + " min, toward zero. The feed's <strong>Pts</strong> column shows what each break earned.</li>" +
        "<li><strong>Build</strong> — latest <code>build-check.yml</code> run (success / failure / no-runs).</li>" +
        "<li><strong>Landed</strong> — confirmed breaks this team filed against others (offense).</li>" +
        "<li><strong>Received</strong> — confirmed breaks others filed against this team (defense).</li>" +
        "<li><strong>High-sev</strong> — of the breaks received, how many were high severity.</li>" +
        "<li><strong>Fixed</strong> — received breaks closed by a merged PR.</li></ul>" +
        "<h3>Acting on a break</h3>" +
        "<p>On the Break Report issue, put the command on the <strong>first line</strong> of a comment:</p><ul>" +
        "<li><code>/repro-confirmed</code> — <em>(targeted team)</em> you reproduced it against your running app → <code>valid</code>; it scores. State <code>repro</code> in the feed.</li>" +
        "<li><code>/repro-failed</code> — <em>(targeted team)</em> you could not reproduce it → <code>invalid</code>; say what you tried.</li>" +
        "<li><code>/out-of-scope</code> — <em>(facilitators only)</em> rule a break invalid (unsafe / off-protocol).</li>" +
        "<li><code>/fix-confirmed</code> — <em>(the breaker who filed it)</em> you re-tested the fixed app and the break is gone → <code>fixed</code> (it scores).</li>" +
        "<li><code>/fix-failed</code> — <em>(the breaker)</em> the break still works → the issue reopens (<code>fix-rejected</code>).</li></ul>" +
        "<p><strong>Fixing a break is a two-step round:</strong> the targeted team opens a PR whose body includes <code>closes #N</code>; " +
        "on merge the issue closes and becomes <code>fix-claimed</code> (State <strong>fix-review</strong> in the feed). The fix only scores " +
        "(<strong>+" + w.fixed + "</strong>) once the <em>breaker who filed it</em> re-tests and confirms with <code>/fix-confirmed</code>. " +
        "If it doesn't hold, the breaker comments <code>/fix-failed</code> and the issue reopens.</p>" +
        "<p><strong>Found (black-box vs white-box):</strong> the Break feed shows how each break was discovered — " +
        "<code>black-box</code> (interface only) or <code>white-box</code> (source-assisted). Per <code>AGENTS_BREAK.md</code>, " +
        "teams work black-box first and only review source after exhausting it.</p>";
    }

    function renderBoard() {
      return fetch(bust("SCOREBOARD.md")).then(function (r) { return r.text(); }).then(function (t) {
        var el = $("board");
        el.innerHTML = marked.parse(t);
        el.querySelectorAll("[data-utc]").forEach(function (span) {
          var d = new Date(span.getAttribute("data-utc"));
          if (!isNaN(d.getTime())) { span.textContent = d.toLocaleString(); $("updated").textContent = "updated " + d.toLocaleTimeString(); }
        });
      }).catch(function (e) { $("board").innerHTML = '<p style="color:var(--danger)">Could not load SCOREBOARD.md: ' + e + "</p>"; });
    }

    function renderGraph() {
      return fetch(bust("scores.json")).then(function (r) { return r.json(); }).then(function (data) {
        var hist = data.history || [], teams = data.teams || [];
        if (!hist.length || !teams.length) throw new Error("no history");
        var labels = hist.map(function (h) { return new Date(h.t).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }); });
        var datasets = teams.map(function (tm, i) {
          return { label: tm.name, data: hist.map(function (h) { var s = h.scores || {}; return (tm.id in s) ? s[tm.id] : null; }),
            borderColor: teamColor(i), backgroundColor: teamColor(i), tension:0.25, spanGaps:true, pointRadius:2 };
        });
        if (chart) chart.destroy();
        chart = new Chart($("scoreChart"), { type:"line", data:{ labels:labels, datasets:datasets },
          options:{ responsive:true, maintainAspectRatio:false, animation:false, interaction:{mode:"index",intersect:false},
            scales:{ y:{title:{display:true,text:"Score"}}, x:{ticks:{maxTicksLimit:12}} }, plugins:{ legend:{position:"bottom"} } } });
      }).catch(function () { var c = $("scoreChart"); if (c) c.parentNode.innerHTML = '<p style="color:var(--muted)">No score history yet.</p>'; });
    }

    function populateTeamFilter() {
      var sel = $("f-team"), cur = sel.value;
      var names = {};
      allBreaks.forEach(function (b) { if (b.from) names[b.from] = 1; if (b.to) names[b.to] = 1; });
      var opts = ['<option value="all">all</option>'].concat(Object.keys(names).sort().map(function (n) {
        return '<option value="' + esc(n) + '">' + esc(n) + "</option>"; }));
      sel.innerHTML = opts.join("");
      sel.value = (cur && names[cur]) ? cur : "all";
    }

    function renderFeedTable() {
      var st = $("f-status").value, tm = $("f-team").value, sv = $("f-sev").value, dc = $("f-disc").value, sort = $("f-sort").value;
      var rows = allBreaks.filter(function (b) {
        return (st === "all" || b.status === st) && (sv === "all" || b.sev === sv) &&
          (dc === "all" || b.discovery === dc) && (tm === "all" || b.from === tm || b.to === tm);
      });
      var sevRank = { high:0, medium:1, low:2, "":3 }, stRank = { fixed:0, "fix-review":1, repro:2, pending:3 };
      if (sort === "newest") rows.sort(function (a, b) { return (b.number||0) - (a.number||0); });
      else if (sort === "status") rows.sort(function (a, b) { return (stRank[a.status]??9) - (stRank[b.status]??9) || (b.number||0)-(a.number||0); });
      else if (sort === "severity") rows.sort(function (a, b) { return (sevRank[a.sev]??9) - (sevRank[b.sev]??9) || (b.number||0)-(a.number||0); });
      else if (sort === "team") rows.sort(function (a, b) { return String(a.to).localeCompare(String(b.to)) || (b.number||0)-(a.number||0); });

      if (!rows.length) { $("feed-table").innerHTML = '<p style="color:var(--muted)">No breaks match.</p>'; return; }
      var html = "<table><thead><tr><th>State</th><th>Found</th><th>Issue</th><th>From → To</th><th>Property</th><th>Class</th><th>Sev</th><th>Pts</th></tr></thead><tbody>";
      rows.forEach(function (b) {
        var title = (b.title || "").replace(/^\[BREAK\]\s*/, "").trim();
        if (title.length > 64) title = title.slice(0, 61) + "…";
        var label = "#" + b.number + (title ? " " + title : "");
        var issue = b.url ? '<a href="' + esc(b.url) + '" target="_blank" rel="noopener">' + esc(label) + "</a>" : esc(label);
        var sevCls = b.sev === "high" ? ' class="sev-high"' : "";
        var found = b.discovery ? "<span class='badge disc-" + esc(b.discovery) + "'>" + esc(b.discovery) + "</span>" : "—";
        var pts = (b.status === "pending") ? "—" : (b.points != null ? b.points : "—");
        html += "<tr><td><span class='badge st-" + esc(b.status) + "'>" + esc(b.status) + "</span></td>" +
          "<td>" + found + "</td>" +
          "<td>" + issue + "</td><td>" + esc(b.from) + " → " + esc(b.to) + "</td>" +
          "<td>" + esc(b.prop) + "</td><td>" + esc(b.cls) + "</td><td" + sevCls + ">" + esc(b.sev) + "</td>" +
          "<td>" + esc(pts) + "</td></tr>";
      });
      $("feed-table").innerHTML = html + "</tbody></table>";
    }

    function renderFeed() {
      return fetch(bust("breaks.json")).then(function (r) { return r.json(); }).then(function (data) {
        allBreaks = data.breaks || [];
        populateTeamFilter();
        renderFeedTable();
      }).catch(function () { $("feed-table").innerHTML = '<p style="color:var(--muted)">No break feed yet.</p>'; });
    }

    function renderTeams() {
      return fetch(bust("teams.json")).then(function (r) { return r.json(); }).then(function (data) {
        var teams = data.teams || [];
        if (!teams.length) { $("teams-body").innerHTML = '<p style="color:var(--muted)">No teams yet.</p>'; return; }
        var html = "<table><thead><tr><th>Team</th><th>Repo</th><th>Members</th></tr></thead><tbody>";
        teams.forEach(function (t) {
          var repo = t.repo
            ? '<a href="https://github.com/' + esc(t.repo) + '" target="_blank" rel="noopener">' + esc(t.repo) + "</a>"
            : "—";
          var members = (t.members || []).map(function (m) {
            return '<a href="https://github.com/' + esc(m) + '" target="_blank" rel="noopener">@' + esc(m) + "</a>";
          }).join(", ") || "—";
          html += "<tr><td>" + esc(t.name) + "</td><td>" + repo + "</td><td>" + members + "</td></tr>";
        });
        $("teams-body").innerHTML = html + "</tbody></table>";
      }).catch(function () { $("teams-body").innerHTML = '<p style="color:var(--muted)">No team roster yet.</p>'; });
    }

    function tick() { return Promise.all([renderBoard(), renderGraph(), renderFeed(), renderTeams()]); }

    ["f-status", "f-team", "f-sev", "f-disc", "f-sort"].forEach(function (id) {
      document.addEventListener("change", function (e) { if (e.target && e.target.id === id) renderFeedTable(); });
    });

    function start() {
      fetch(bust("settings.json")).then(function (r) { return r.json(); })
        .then(function (s) { settings = Object.assign({}, DEFAULTS, s); })
        .catch(function () { settings = DEFAULTS; })
        .finally(function () {
          applyChrome();
          renderColumns();
          tick();
          if (timer) clearInterval(timer);
          if (settings.liveUpdates) timer = setInterval(tick, Math.max(5, settings.refreshSeconds) * 1000);
        });
    }
    start();
  </script>
</body>
</html>
